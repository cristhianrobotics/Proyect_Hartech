controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true
    joints:
    - joint_1
    - joint_2
    - joint_3
    - joint_4
    - joint_5
    - joint_6
    - hartech_left_finger_joint
    interfaces:
    - position
    - velocity
    - effort

arm_controller:
  ros__parameters:
    use_sim_time: true
    joints:
    - joint_1
    - joint_2
    - joint_3
    - joint_4
    - joint_5
    - joint_6
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    open_loop_control: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 3.0
      joint_1:
        trajectory: 0.15
        goal: 0.05
      joint_2:
        trajectory: 0.15
        goal: 0.05
      joint_3:
        trajectory: 0.15
        goal: 0.05
      joint_4:
        trajectory: 0.15
        goal: 0.05
      joint_5:
        trajectory: 0.15
        goal: 0.05
      joint_6:
        trajectory: 0.15
        goal: 0.05

gripper_controller:
  ros__parameters:
    use_sim_time: true
    joints:
    - hartech_left_finger_joint
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
    allow_partial_joints_goal: false
    constraints:
      goal_time: 3.0
      stopped_velocity_tolerance: 0.01
      hartech_left_finger_joint:
        trajectory: 0.005
        goal: 0.0005