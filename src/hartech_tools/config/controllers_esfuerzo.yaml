# HARTECH - Control DINAMICO por esfuerzo. SOLO para gazebo_esfuerzo.launch.py.
# No reemplaza config/controllers.yaml del Gazebo normal.
controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    arm_effort_controller:
      type: forward_command_controller/ForwardCommandController

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true
    # No incluir los dos joints mimic del gripper (se evitan fallos de interfaces).
    joints: [joint_1, joint_2, joint_3, joint_4, joint_5, joint_6, hartech_left_finger_joint]
    interfaces: [position, velocity, effort]

arm_effort_controller:
  ros__parameters:
    use_sim_time: true
    joints: [joint_1, joint_2, joint_3, joint_4, joint_5, joint_6]
    interface_name: effort

gripper_controller:
  ros__parameters:
    use_sim_time: true
    joints: [hartech_left_finger_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    constraints:
      goal_time: 3.0
      stopped_velocity_tolerance: 0.01
      hartech_left_finger_joint: {trajectory: 0.005, goal: 0.0005}
